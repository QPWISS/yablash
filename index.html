<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>يابلاش</title>
<meta property="og:title" content="مركز يابلاش"><meta property="og:description" content="إكسسوارات ومكياج وعطور وهدايا في مارع. أرسل طلبك عبر واتساب.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--r:#C2547A;--rd:#9C3B5E;--pk:#F7C9D7;--bl:#FDEEF2;--g:#C99A86;--i:#4A2C36;--bg:#FFF8F6}
*{box-sizing:border-box;margin:0}body{font:16px/1.6 Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--i)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}a{color:inherit}:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.bar{background:var(--rd);color:#fde7ee;text-align:center;padding:6px;font-size:14px}
.nav{position:sticky;top:0;z-index:5;background:#fffd;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:10px 16px;color:var(--rd);border-bottom:1px solid var(--bl)}
.lg{font-size:26px;font-weight:800}.cb2{position:relative}.cb2 i{position:absolute;top:-6px;left:-8px;background:var(--r);color:#fff;font:600 11px/18px Cairo;min-width:18px;border-radius:9px;text-align:center}
.sp{display:flex;gap:8px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bl)}.sp[hidden]{display:none}
input[type=search],select{padding:9px 14px;border:2px solid var(--pk);border-radius:24px;font:inherit;background:#fff;color:var(--i)}input[type=search]{flex:1;min-width:0}
.hero{min-height:270px;display:flex;align-items:center;padding:28px 22px;color:var(--rd);background:radial-gradient(circle at 12% 22%,#fffa 0 70px,#fff0 71px),radial-gradient(circle at 88% 85%,#e98fb055 0 110px,#0000 111px),linear-gradient(135deg,#FDEEF2,#F7C9D7)}
h1{font-size:34px;font-weight:800;line-height:1.35}.hero p{margin:6px 0 16px;max-width:300px}
.cta{display:inline-block;background:var(--r);color:#fff;text-decoration:none;padding:9px 24px;border-radius:24px;font-weight:600;margin-inline-end:8px}.g2{background:#fff;color:var(--rd)}
.bd{display:inline-block;margin-top:12px;padding:2px 14px;border-radius:14px;font-size:14px;background:#fff;font-weight:600}.o{color:#1d7a46}.x{color:#a33}
.dv{background:#fff;text-align:center;padding:7px;color:var(--rd);font-weight:600;border-bottom:1px solid var(--bl)}
.cats{display:flex;gap:14px;overflow-x:auto;padding:18px 16px 6px;background:#fff;scrollbar-width:none}.cats button{flex:none;width:70px;text-align:center;font-size:13px;color:var(--i)}
.cats span{display:flex;align-items:center;justify-content:center;width:62px;height:62px;margin:0 auto 4px;border-radius:50%;background:var(--bl);border:2px solid var(--pk);font-size:26px}.cats .on span{background:var(--r);border-color:var(--r)}.cats .on{color:var(--rd);font-weight:700}
main{max-width:1000px;margin:auto;padding:6px 14px 14px}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.st{font-size:22px;color:var(--rd);text-align:center;margin:30px 0 14px}.st::after{content:'';display:block;width:50px;height:3px;background:var(--g);margin:6px auto 0;border-radius:2px}
.c{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 3px 14px #c2547a1a}
.im{aspect-ratio:1;background:linear-gradient(135deg,#FDEEF2,#F7C9D7);display:flex;align-items:center;justify-content:center;font-size:44px}.im img{width:100%;height:100%;object-fit:cover}
.t{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;font-size:12px;padding:1px 10px;border-radius:10px}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1;text-align:center}.cb h3{font-size:15px;line-height:1.4}.cb small{color:#8d6b76}
.pr{font-weight:800;color:var(--r);font-size:18px}.pr s{color:#999;font-weight:400;font-size:13px;margin-inline-start:6px}
.ac{display:flex;gap:6px;margin-top:auto;padding-top:6px}.ac button{flex:1;padding:7px 4px;border-radius:20px;font-size:14px}
.a1{background:var(--r);color:#fff}.a2{background:#fff;color:var(--rd);border:1px solid var(--g)}.a3{background:var(--bl);color:var(--rd);flex:0 0 36px!important}button:disabled{opacity:.45}
.info{background:#fff;border-radius:16px;padding:16px;margin-top:24px;border:1px solid var(--pk)}.info h2{font-size:19px;color:var(--rd)}
#dr{position:fixed;inset:0;background:#0007;display:none;z-index:9}#dr>div{background:#fff;position:absolute;bottom:0;inset-inline:0;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:600px;margin:auto}
.ro{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.ro span{flex:1}.ro button{width:30px;height:30px;border-radius:50%;background:var(--bl)}
.sd{width:100%;background:#25a35a;color:#fff;padding:12px;border-radius:12px;margin-top:12px;font-weight:600}footer{text-align:center;color:#8d6b76;font-size:13px;padding:18px}
</style></head><body>
<div class="bar" id="an"></div>
<div class="nav"><button aria-label="بحث" onclick="sp.hidden=!sp.hidden;if(!sp.hidden)q.focus()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg></button><b class="lg" id="nm">يابلاش</b><button class="cb2" aria-label="سلة الطلب" onclick="oc()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 4h2l2.2 10h9.6L19 7H6.2"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><i id="bg" hidden>0</i></button></div>
<div class="sp" id="sp" hidden><input type="search" id="q" placeholder="ابحث عن منتج"><select id="so" aria-label="الترتيب"><option value="d">الترتيب</option><option value="n">الأحدث</option></select></div>
<section class="hero" id="hr"><div><h1 id="h1"></h1><p id="h2"></p><a class="cta" href="#pro">تصفّحوا المنتجات</a><a class="cta g2" id="wb" target="_blank" rel="noopener">تواصل عبر واتساب</a><br><span class="bd" id="bd" hidden></span></div></section>
<div class="dv">🚚 التوصيل متوفر</div>
<div class="cats" id="ch"></div>
<main id="pro"><div id="grid"></div><div class="info" id="inf"></div></main><footer id="ft"></footer>
<div id="dr" onclick="if(event.target==dr)dr.style.display='none'"><div><h2>سلة الطلب</h2><div id="ci"></div><button class="sd" onclick="send()">أرسل طلبك عبر واتساب</button></div></div>
<script>
let D,cart=JSON.parse(localStorage.yc||'{}'),cat='all',hid=location.hash.startsWith('#p-')?location.hash.slice(3):'';
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EM={'مكياج':'💄','عطور':'🧴','إكسسوارات':'💍','هدايا':'🎁','لانجري':'👙','أدوات كهربائية':'🔌'};
const oc=()=>{dr.style.display='block';rc()};
fetch('products.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>$('#grid').textContent='تعذّر تحميل المنتجات، يرجى تحديث الصفحة.');
function init(){const s=D.shop;document.title=s.name;$('#nm').textContent=s.name;$('#h1').textContent=s.heroTitle||s.name;$('#h2').textContent=s.heroSub||'إكسسوارات · مكياج · عطور · هدايا · لانجري · أدوات كهربائية';
if(s.hero)$('#hr').style.background='linear-gradient(270deg,#fdeef2ee 38%,#fdeef255),url('+s.hero+') center/cover';
$('#an').textContent=s.announcement||'';$('#an').hidden=!s.announcement;$('#ft').textContent='© '+s.name;$('#wb').hidden=!s.whatsapp;$('#wb').href='https://wa.me/'+s.whatsapp;
if(s.open!=null&&s.close!=null){const h=+new Intl.DateTimeFormat('en',{hour:'numeric',hour12:false,timeZone:'Asia/Damascus'}).format(new Date())%24,o=h>=s.open&&h<s.close;$('#bd').hidden=0;$('#bd').className='bd '+(o?'o':'x');$('#bd').textContent=o?'● مفتوح الآن':'● مغلق الآن'}
$('#inf').innerHTML='<h2>معلومات المركز</h2><p>🚚 التوصيل متوفر.</p>'+(s.address?`<p>📍 ${e(s.address)}</p>`:'')+(s.hours?`<p>🕙 ${e(s.hours)}</p>`:'')+(s.instagram?`<p><a href="https://instagram.com/${e(s.instagram)}" target="_blank" rel="noopener">تابعونا على إنستغرام</a></p>`:'');
D.products=D.products.filter(p=>!p.hidden);D.products.forEach(p=>{if(p.offer==null&&p.old>p.price)p.offer=true});cart=Object.fromEntries(Object.entries(cart).filter(([k])=>D.products.some(p=>p.id==k)));$('#q').oninput=$('#so').onchange=draw;draw()}
const pr=p=>p.offer?`<div class="pr">$${p.price}<s>$${p.old}</s></div>`:(D.shop.showPrices&&p.price?`<div class="pr">$${p.price}</div>`:'');
const card=p=>`<div class="c"><div class="im">${p.img?`<img src="${e(p.img)}" alt="${e(p.name)}" loading="lazy">`:(EM[p.cat]||'✦')}</div>${p.out?'<span class="t" style="background:#777">نفد</span>':p.new?'<span class="t">جديد</span>':''}<div class="cb"><h3>${e(p.name)}</h3><small>${e(p.desc)}</small>${pr(p)}<div class="ac"><button class="a1" ${p.out?'disabled':''} onclick="add('${p.id}')">أضف للسلة</button><button class="a2" ${p.out?'disabled':''} onclick="one('${p.id}')">اطلب الآن</button><button class="a3" aria-label="نسخ الرابط" onclick="sh('${p.id}')">🔗</button></div></div></div>`;
const F=(t,L)=>L.length?`<h2 class="st">${t}</h2><div class="gr">${L.slice(0,8).map(card).join('')}</div>`:'';
function draw(){$('#ch').innerHTML=[['all','الكل','✨'],['off','العروض','🏷️'],...D.categories.map(c=>[c,c,EM[c]||'✦'])].map(([k,n,i])=>`<button class="${k==cat?'on':''}" onclick="cat='${e(k)}';hid='';draw()"><span>${i}</span>${e(n)}</button>`).join('');
const q=$('#q').value.trim(),S={d:()=>0,n:(a,b)=>b.id-a.id}[$('#so').value];
let P=D.products.filter(p=>hid?p.id==hid:(cat=='all'||(cat=='off'?p.offer:p.cat==cat))&&(!q||(p.name+(p.desc||'')).includes(q))).sort((a,b)=>(!!a.out-!!b.out)||(!!b.pin-!!a.pin)||S(a,b)),h;
if(!hid&&cat=='all'&&!q)h=F('منتجات مميزة',P.filter(p=>p.pin))+F('وصل حديثاً',P.filter(p=>p.new&&!p.pin))+D.categories.map(c=>F((EM[c]||'')+' '+e(c),P.filter(p=>p.cat==c))).join('');
else h=(hid?'<p style="margin-top:14px"><button class="a3" style="padding:6px 14px;border-radius:8px" onclick="hid=\'\';history.replaceState(0,0,location.pathname);draw()">عرض كل المنتجات</button></p>':'')+(P.length?'<div class="gr" style="margin-top:14px">'+P.map(card).join('')+'</div>':'');
$('#grid').innerHTML=h||'<p>لا توجد منتجات مطابقة.</p>';fab()}
const n=()=>Object.values(cart).reduce((a,b)=>a+b,0),pf=id=>D.products.find(p=>p.id==id),wa=t=>open('https://wa.me/'+D.shop.whatsapp+'?text='+encodeURIComponent(t));
function save(){localStorage.yc=JSON.stringify(cart);fab();rc()}
function fab(){bg.hidden=!n();bg.textContent=n()}
function add(i){cart[i]=(cart[i]||0)+1;save()}
function rc(){$('#ci').innerHTML=Object.entries(cart).map(([i,c])=>{const p=pf(i);return`<div class="ro"><span>${e(p.name)}${p.offer?' · $'+p.price:''}</span><button onclick="cart['${i}']--;if(!cart['${i}'])delete cart['${i}'];save()">−</button><b>${c}</b><button onclick="add('${i}')">+</button></div>`}).join('')||'<p>السلة فارغة.</p>';if(!n())dr.style.display='none'}
const ln=(p,c)=>`- ${p.name} × ${c}${p.offer?' ('+p.price+'$)':''}`;
function send(){wa('السلام عليكم، بدي أطلب:\n'+Object.entries(cart).map(([i,c])=>ln(pf(i),c)).join('\n'))}
function one(i){const p=pf(i);wa('السلام عليكم، بدي أطلب: '+p.name+(p.offer?` (${p.price}$)`:''))}
function sh(i){const u=location.href.split('#')[0]+'#p-'+i;navigator.clipboard?.writeText(u).then(()=>alert('تم نسخ الرابط'),()=>prompt('انسخ الرابط',u))}
</script></body></html>
