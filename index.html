<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>يابلاش</title>
<meta property="og:title" content="مركز يابلاش"><meta property="og:description" content="إكسسوارات ومكياج وعطور وهدايا في مارع. أرسل طلبك عبر واتساب.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--r:#B83A62;--rd:#8E2A4B;--p:#5A1F3B;--b:#FBF4EC;--g:#C6A15B;--i:#3A2430;--l:#EBD5C3}
*{box-sizing:border-box;margin:0}body{font:16px/1.6 Cairo,Tahoma,sans-serif;background:var(--b);color:var(--i);padding-bottom:80px}
button{font:inherit;cursor:pointer;border:0}a{color:inherit}:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.bar{background:var(--p);color:#f3dfb6;text-align:center;padding:6px;font-size:14px}
header{background:linear-gradient(160deg,#FBE6EC,#EFC3D0);color:var(--p);padding:30px 18px 24px;text-align:center;border-bottom:3px solid var(--g)}
h1{font-size:46px;font-weight:800;line-height:1.3}header p{font-size:15px}
.bd{display:inline-block;margin-top:8px;padding:2px 14px;border-radius:14px;font-size:14px;background:#fff;font-weight:600}.o{color:#1d7a46}.x{color:#a33}
.wb{display:inline-block;margin-top:12px;background:var(--r);color:#fff;text-decoration:none;padding:9px 26px;border-radius:24px;font-weight:600}
.dv{background:#fff;text-align:center;padding:7px;color:var(--rd);font-weight:600;border-bottom:1px solid var(--l)}
.top{position:sticky;top:0;z-index:5;background:var(--b);padding:10px 14px;border-bottom:1px solid var(--l)}.sr{display:flex;gap:8px}
input[type=search],select{padding:9px 14px;border:2px solid var(--l);border-radius:24px;font:inherit;background:#fff;color:var(--i)}input[type=search]{flex:1;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px}.chips button{white-space:nowrap;padding:6px 16px;border-radius:20px;background:#fff;color:var(--p);border:1px solid var(--l)}.chips .on{background:var(--r);color:#fff;border-color:var(--r)}
main{max-width:1000px;margin:auto;padding:14px}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.sec{font-size:22px;color:var(--p);margin:28px 0 12px;padding-bottom:6px;border-bottom:2px solid var(--g)}.sec:first-child{margin-top:6px}
.c{background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 2px 10px #b83a6214}
.im{aspect-ratio:1;background:linear-gradient(135deg,#FBE6EC,#EFC3D0);display:flex;align-items:center;justify-content:center;font-size:44px}.im img{width:100%;height:100%;object-fit:cover}
.t{position:absolute;top:8px;right:8px;background:var(--g);color:#fff;font-size:12px;padding:1px 10px;border-radius:10px}
.cb{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}.cb h3{font-size:15px;line-height:1.4}.cb small{color:#85646f}
.pr{font-weight:800;color:var(--r);font-size:18px}.pr s{color:#999;font-weight:400;font-size:13px;margin-inline-start:6px}
.ac{display:flex;gap:6px;margin-top:auto;padding-top:6px}.ac button{flex:1;padding:7px 4px;border-radius:10px;font-size:14px}
.a1{background:var(--r);color:#fff}.a2{background:#fff;color:var(--rd);border:1px solid var(--g)!important}.a3{background:#f4e6dc;color:var(--p);flex:0 0 36px!important}button:disabled{opacity:.45}
.info{background:#fff;border-radius:16px;padding:16px;margin-top:22px;border:1px solid var(--l)}.info h2{font-size:19px;color:var(--p)}
#fab{position:fixed;bottom:14px;inset-inline:14px;background:var(--p);color:#f3dfb6;padding:13px;border-radius:30px;font-weight:600;display:none;z-index:6}
#dr{position:fixed;inset:0;background:#0007;display:none;z-index:9}#dr>div{background:#fff;position:absolute;bottom:0;inset-inline:0;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px;max-width:600px;margin:auto}
.ro{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}.ro span{flex:1}.ro button{width:30px;height:30px;border-radius:50%;background:#f4e6dc}
.sd{width:100%;background:#25a35a;color:#fff;padding:12px;border-radius:12px;margin-top:12px;font-weight:600}footer{text-align:center;color:#85646f;font-size:13px;padding:18px}
</style></head><body>
<div class="bar" id="an"></div>
<header><h1 id="nm">يابلاش</h1><p>إكسسوارات · مكياج · عطور · هدايا · لانجري · أدوات كهربائية</p><span class="bd" id="bd" hidden></span><br><a class="wb" id="wb" target="_blank" rel="noopener">تواصل عبر واتساب</a></header>
<div class="dv">🚚 التوصيل متوفر</div>
<div class="top"><div class="sr"><input type="search" id="q" placeholder="ابحث عن منتج"><select id="so" aria-label="الترتيب"><option value="d">الترتيب</option><option value="n">الأحدث</option></select></div><div class="chips" id="ch"></div></div>
<main><div id="grid"></div><div class="info" id="inf"></div></main><footer id="ft"></footer>
<button id="fab" onclick="dr.style.display='block';rc()"></button>
<div id="dr" onclick="if(event.target==dr)dr.style.display='none'"><div><h2>سلة الطلب</h2><div id="ci"></div><button class="sd" onclick="send()">أرسل طلبك عبر واتساب</button></div></div>
<script>
let D,cart=JSON.parse(localStorage.yc||'{}'),cat='all',hid=location.hash.startsWith('#p-')?location.hash.slice(3):'';
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const EM={'مكياج':'💄','عطور':'🧴','إكسسوارات':'💍','هدايا':'🎁','لانجري':'👙','أدوات كهربائية':'🔌'};
fetch('products.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;init()}).catch(()=>$('#grid').textContent='تعذّر تحميل المنتجات، يرجى تحديث الصفحة.');
function init(){const s=D.shop;document.title=s.name;$('#nm').textContent=s.name;$('#an').textContent=s.announcement||'';$('#an').hidden=!s.announcement;$('#ft').textContent='© '+s.name;
$('#wb').hidden=!s.whatsapp;$('#wb').href='https://wa.me/'+s.whatsapp;
if(s.open!=null&&s.close!=null){const h=+new Intl.DateTimeFormat('en',{hour:'numeric',hour12:false,timeZone:'Asia/Damascus'}).format(new Date())%24,o=h>=s.open&&h<s.close;$('#bd').hidden=0;$('#bd').className='bd '+(o?'o':'x');$('#bd').textContent=o?'● مفتوح الآن':'● مغلق الآن'}
$('#inf').innerHTML='<h2>معلومات المركز</h2><p>🚚 التوصيل متوفر.</p>'+(s.address?`<p>📍 ${e(s.address)}</p>`:'')+(s.hours?`<p>🕙 ${e(s.hours)}</p>`:'')+(s.instagram?`<p><a href="https://instagram.com/${e(s.instagram)}" target="_blank" rel="noopener">تابعونا على إنستغرام</a></p>`:'');
D.products=D.products.filter(p=>!p.hidden);D.products.forEach(p=>{if(p.offer==null&&p.old>p.price)p.offer=true});cart=Object.fromEntries(Object.entries(cart).filter(([k])=>D.products.some(p=>p.id==k)));$('#q').oninput=$('#so').onchange=draw;draw()}
const pr=p=>p.offer?`<div class="pr">$${p.price}<s>$${p.old}</s></div>`:(D.shop.showPrices&&p.price?`<div class="pr">$${p.price}</div>`:'');
const card=p=>`<div class="c"><div class="im">${p.img?`<img src="${e(p.img)}" alt="${e(p.name)}" loading="lazy">`:(EM[p.cat]||'✦')}</div>${p.out?'<span class="t" style="background:#777">نفد</span>':p.new?'<span class="t">جديد</span>':''}<div class="cb"><h3>${e(p.name)}</h3><small>${e(p.desc)}</small>${pr(p)}<div class="ac"><button class="a1" ${p.out?'disabled':''} onclick="add('${p.id}')">أضف للسلة</button><button class="a2" ${p.out?'disabled':''} onclick="one('${p.id}')">اطلب الآن</button><button class="a3" aria-label="نسخ الرابط" onclick="sh('${p.id}')">🔗</button></div></div></div>`;
function draw(){$('#ch').innerHTML=[['all','الكل'],['off','العروض'],...D.categories.map(c=>[c,c])].map(([k,n])=>`<button class="${k==cat?'on':''}" onclick="cat='${e(k)}';hid='';draw()">${e(n)}</button>`).join('');
const q=$('#q').value.trim(),S={d:()=>0,n:(a,b)=>b.id-a.id}[$('#so').value];
let P=D.products.filter(p=>hid?p.id==hid:(cat=='all'||(cat=='off'?p.offer:p.cat==cat))&&(!q||(p.name+(p.desc||'')).includes(q))).sort((a,b)=>(!!a.out-!!b.out)||(!!b.pin-!!a.pin)||S(a,b)),h;
if(!hid&&cat=='all'&&!q)h=D.categories.map(c=>{const X=P.filter(p=>p.cat==c);return X.length?`<h2 class="sec">${EM[c]||''} ${e(c)}</h2><div class="gr">${X.map(card).join('')}</div>`:''}).join('');
else h=(hid?'<p style="margin-bottom:10px"><button class="a3" style="padding:6px 14px;border-radius:8px" onclick="hid=\'\';history.replaceState(0,0,location.pathname);draw()">عرض كل المنتجات</button></p>':'')+(P.length?'<div class="gr">'+P.map(card).join('')+'</div>':'');
$('#grid').innerHTML=h||'<p>لا توجد منتجات مطابقة.</p>';fab()}
const n=()=>Object.values(cart).reduce((a,b)=>a+b,0),pf=id=>D.products.find(p=>p.id==id),wa=t=>open('https://wa.me/'+D.shop.whatsapp+'?text='+encodeURIComponent(t));
function save(){localStorage.yc=JSON.stringify(cart);fab();rc()}
function fab(){$('#fab').style.display=n()?'block':'none';$('#fab').textContent='سلة الطلب ('+n()+')'}
function add(i){cart[i]=(cart[i]||0)+1;save()}
function rc(){$('#ci').innerHTML=Object.entries(cart).map(([i,c])=>{const p=pf(i);return`<div class="ro"><span>${e(p.name)}${p.offer?' · $'+p.price:''}</span><button onclick="cart['${i}']--;if(!cart['${i}'])delete cart['${i}'];save()">−</button><b>${c}</b><button onclick="add('${i}')">+</button></div>`}).join('')||'<p>السلة فارغة.</p>';if(!n())dr.style.display='none'}
const ln=(p,c)=>`- ${p.name} × ${c}${p.offer?' ('+p.price+'$)':''}`;
function send(){wa('السلام عليكم، بدي أطلب:\n'+Object.entries(cart).map(([i,c])=>ln(pf(i),c)).join('\n'))}
function one(i){const p=pf(i);wa('السلام عليكم، بدي أطلب: '+p.name+(p.offer?` (${p.price}$)`:''))}
function sh(i){const u=location.href.split('#')[0]+'#p-'+i;navigator.clipboard?.writeText(u).then(()=>alert('تم نسخ الرابط'),()=>prompt('انسخ الرابط',u))}
</script></body></html>
